    <style>
      /* Customer's invoice: a document view of one invoice from a supplier */
      .cv-user__text { display: flex; flex-direction: column; line-height: 20px; }
      .cv-user__text small { font-weight: 400; font-size: 12px; line-height: 16px; color: var(--co-soft); }
      .cd-doc { width: 100%; max-width: 872px; margin: 0 auto; background: #fff; }
      .cd-banner { background: #000; color: #fff; padding: 16px 22px; }
      .cd-banner__top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
      .cd-logo { display: block; height: 84px; width: auto; filter: invert(1); }
      .cd-mark { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; letter-spacing: 0.42em; text-transform: uppercase; }
      .cd-banner__no { text-align: right; }
      .cd-banner__kind { display: block; font-size: 12px; line-height: 16px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 255, 255, 0.72); }
      .cd-banner__num { display: block; margin-top: 4px; font-size: 26px; line-height: 32px; font-weight: 700; }
      .cd-link { color: var(--co-go-text); text-decoration: underline; font-weight: 400; }
      .cd-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; padding: 20px 22px 24px; }
      .cd-meta h3 { font-size: 14px; line-height: 20px; font-weight: 400; color: var(--co-soft); margin-bottom: 10px; }
      .cd-meta p { line-height: 20px; overflow-wrap: anywhere; }
      .cd-meta p + p { margin-top: 10px; }
      .cd-meta strong { font-weight: 700; }
      .cd-top { display: grid; grid-template-columns: minmax(250px, 0.9fr) 1.1fr; gap: 32px; padding: 22px; border-bottom: 1px solid var(--co-border-soft); align-items: start; }
      .cd-lead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .cd-stamp { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 108px; height: 108px; border: 3px solid #1c6823; border-radius: 50%; box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 6px #1c6823; color: #1c6823; font-size: 11px; line-height: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; transform: rotate(-8deg); opacity: 0.9; flex: none; }
      .cd-stamp--overdue { border-color: var(--co-error); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 6px var(--co-error); color: var(--co-error); font-size: 13px; letter-spacing: 0.12em; }
      .cd-key { display: grid; gap: 8px; }
      .cd-key > div { display: flex; flex-direction: column; gap: 2px; }
      .cd-label { color: var(--co-soft); font-size: 14px; line-height: 20px; }
      .cd-amt { font-size: 28px; line-height: 36px; font-weight: 700; white-space: nowrap; }
      .cd-amt .cd-cur { font-size: 14px; font-weight: 400; color: var(--co-soft); margin-left: 4px; }
      .cd-date { font-size: 16px; line-height: 24px; font-weight: 700; white-space: nowrap; }
      .cd-date--paid { font-weight: 400; }
      .cd-dates { display: flex; align-items: center; gap: 14px; }
      .cd-facts { display: grid; gap: 7px; padding-left: 32px; border-left: 1px solid var(--co-border-soft); align-self: stretch; align-content: center; }
      .cd-facts > div { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: baseline; }
      .cd-facts dt { font-size: 14px; line-height: 18px; color: var(--co-soft); }
      .cd-facts dd { font-size: 14px; line-height: 18px; }
      .cd-table { margin: 0 10px; border-top: 1px solid var(--co-border-soft); }
      .cd-row { display: grid; grid-template-columns: minmax(200px, 1fr) 110px 70px 100px 130px; align-items: center; min-height: 54px; border-bottom: 1px solid var(--co-border-soft); }
      .cd-row > * { padding: 4px 12px; }
      .cd-row--head { min-height: 40px; font-weight: 700; }
      .cd-row:not(.cd-row--head) { min-height: 81px; }
      .cd-table .id-prod { gap: 12px; }
      .cd-table .id-prod img { width: 60px; height: 60px; }
      .cd-table .id-prod__info { gap: 0; }
      .cd-row .cd-n { text-align: right; }
      .cd-totals { width: 260px; margin: 22px 22px 28px auto; display: grid; gap: 10px; }
      .cd-totals div { display: flex; justify-content: space-between; align-items: baseline; }
      .cd-totals hr { border: 0; border-top: 2px solid var(--co-border); margin: 6px 0 3px; }
      .cd-totals .cd-cur { font-size: 12px; color: var(--co-soft); margin-left: 4px; }
      .cd-totals .is-strong { font-weight: 700; }
      .cd-memo { margin: 0 22px; padding: 16px 0 20px; border-top: 1px solid var(--co-border-soft); }
      .cd-memo h3 { font-size: 14px; line-height: 20px; font-weight: 700; margin-bottom: 4px; }
      .cd-terms { padding: 22px; font-size: 11px; line-height: 14px; color: var(--co-soft); }
      .cd-terms h3 { font-size: 11px; color: var(--co-text); font-weight: 700; margin-bottom: 8px; }
      .cd-terms p { margin-bottom: 14px; }
      .iv-mail__logo[hidden] { display: none; }
      .cv-mail__sup { margin: 0 0 12px; text-align: center; }
      @media (max-width: 760px) { .cd-meta { grid-template-columns: 1fr; } .cd-top { grid-template-columns: 1fr; } .cd-facts { padding-left: 0; border-left: 0; } .cd-banner__top { flex-direction: column; align-items: flex-start; } .cd-banner__no { text-align: left; } .cd-row { min-width: 640px; } .cd-table { overflow-x: auto; } }
    </style>

    <script>
      (function () {
        var $ = function (s) { return document.querySelector(s); };
        var esc = function (v) { return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var money = function (c) { return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
        var cents = function (str) { return Math.round((parseFloat(String(str).replace(/[$,]/g, '')) || 0) * 100); };
        var BADGE = { Paid: 'success', Partial: 'caution', Overdue: 'danger', Unpaid: 'neutral' };

        /* The invoice list saves its rows (with their current status) when an invoice is opened. */
        var list = null;
        try { list = JSON.parse(sessionStorage.getItem('civ-list')); } catch (e) {}
        var id = new URLSearchParams(location.search).get('inv');
        var r = list && list.filter(function (x) { return x.inv === id; })[0];
        var main = $('#id-main');
        if (!r) {
          document.title = 'Invoice not found — NuORDER';
          main.innerHTML = '<a class="id-back" href="customer-invoices.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>Invoices</a><h1 class="id-title">Invoice not found</h1><p>Open an invoice from the invoice list.</p>';
          return;
        }
        document.title = r.inv + ' — NuORDER';

        /* Who issued it (the list only carries the supplier's name). */
        var SUP = {
          'Thirty Three Threads': { legal: 'Thirty Three Threads Vancouver', addr: '123 Another Street, Vancouver BC, V6J 1J2, Canada', phone: '+1 604 506-5646', email: 'sales@33threads.com', tax: 'GST/HST 812345678 RT0001' },
          'Gaea Yoga Co.': { legal: 'Gaea Yoga Co. Portland', addr: '410 NW Davis Street, Portland OR, 97209, USA', phone: '+1 503 555-0134', email: 'priya.nair@gaeayoga.com', tax: 'EIN 93-1204567' },
          'Halo Active': { legal: 'Halo Active Toronto', addr: '77 Spadina Avenue, Toronto ON, M5V 2J4, Canada', phone: '+1 416 555-0178', email: 'lena.fischer@haloactive.com', tax: 'GST/HST 845671234 RT0001' },
          'Jade Harmony': { legal: 'Jade Harmony Seattle', addr: '900 Pine Street, Seattle WA, 98101, USA', phone: '+1 206 555-0192', email: 'marcus.bell@jadeharmony.com', tax: 'EIN 91-7788123' },
          'Lifeform Props': { legal: 'Lifeform Props Calgary', addr: '212 10th Avenue SW, Calgary AB, T2R 0A4, Canada', phone: '+1 403 555-0165', email: 'sofia.reyes@lifeformprops.com', tax: 'GST/HST 867123450 RT0001' }
        };
        var sup = SUP[r.supplier] || { legal: r.supplier, addr: '', phone: '', email: '', tax: '' };
        var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        /* Street and city on one line; postal code and country together on the next. */
        function addrLines(a) { var p = a.split(', '); return esc(p.slice(0, 2).join(', ')) + '<br>' + esc(p.slice(2).join(', ')); }

        /* Send invoice */
        var sdlg = $('#iv-send-dlg'), sTo = $('#sf-to'), sSub = $('#sf-subject'), sMsg = $('#sf-msg');
        var EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;.]{2,}$/;
        function syncSend() {
          var to = sTo.value.trim(), sub = sSub.value.trim(), msg = sMsg.value.trim();
          var toErr = !to ? 'Enter an email address.' : !EMAIL_RE.test(to) ? 'Enter a valid email address, like name@example.com.' : '';
          var show = sTo.getAttribute('data-touched') === '1' && !!toErr;
          $('#sf-to-err').textContent = show ? toErr : '';
          sTo.setAttribute('aria-invalid', String(show));
          sTo.classList.toggle('is-invalid', show);
          $('#iv-send-go').disabled = !(!toErr && sub && msg);
          [['#mp-to', to, 'name@email.com'], ['#mp-subject', sub, 'email subject'], ['#mp-msg', sMsg.value, 'Personal message appears here']].forEach(function (x) {
            var el = $(x[0]); el.textContent = x[1] ? x[1] : x[2]; el.classList.toggle('is-placeholder', !x[1]);
          });
        }
        function openSend() {
          sTo.setAttribute('data-touched', '0'); sTo.value = ''; sSub.value = 'Invoice ' + r.inv + ' from ' + r.supplier; sMsg.value = ''; $('#sf-cc').value = '';
          $('#mp-list').innerHTML = '<div class="iv-mail__row iv-mail__row--head"><span>Invoice #</span><span>Status</span><span class="iv-num">Amount due</span></div>' +
            '<div class="iv-mail__row"><span><span class="iv-mail__link">' + esc(r.inv) + '</span></span><span><span class="cf-badge cf-badge--' + BADGE[r.status] + '">' + esc(r.status) + '</span></span><span class="iv-num">' + esc(usd(dueNow())) + '</span></div>';
          $('#mp-total').textContent = usd(dueNow());
          $('#mp-sup').textContent = r.supplier;
          // The supplier's logo heads the email; a supplier without one shows its name instead.
          var hasLogo = r.supplier === 'Thirty Three Threads';
          $('#mp-logo').hidden = !hasLogo; $('#mp-supline').hidden = hasLogo;
          syncSend(); sdlg.showModal(); focusPlain(sTo);
        }
        [sTo, sSub, sMsg].forEach(function (el) { el.addEventListener('input', syncSend); });
        sTo.addEventListener('blur', function () { sTo.setAttribute('data-touched', '1'); syncSend(); });
        qa('[data-close-send]', sdlg).forEach(function (b) { b.addEventListener('click', function () { sdlg.close(); }); });
        sdlg.addEventListener('click', function (e) { if (e.target === sdlg) sdlg.close(); });
        $('#iv-send-form').addEventListener('submit', function (e) {
          var to = sTo.value.trim();
          if (!EMAIL_RE.test(to)) { e.preventDefault(); sTo.setAttribute('data-touched', '1'); syncSend(); sTo.focus(); return; }
          toast('Invoice sent to ' + to);
        });

        /* Collect payment: the checkout payment module for this one invoice, with an editable amount (full balance to start). */
        function cpAmount() { return parseFloat(cpInput.value.replace(/[$,\s]/g, '')); }
        function cpValidate() {
          var err = amountError(cpRow, COLLECT_MIN), shown = cpInput.getAttribute('data-touched') === '1' && !!err;
          $('#cp-amt-err').textContent = shown ? err : '';
          cpInput.parentNode.classList.toggle('is-invalid', shown);
          cpInput.setAttribute('aria-invalid', String(shown));
          cpPay.textContent = err ? 'Pay' : 'Pay ' + usd(cpAmount());
          updatePay();
        }
        cpInput.addEventListener('input', function () { cpInput.setAttribute('data-touched', '1'); cpValidate(); });
        cpInput.addEventListener('focusout', function () {
          cpInput.setAttribute('data-touched', '1');
          if (!amountError(cpRow, COLLECT_MIN)) cpInput.value = usd(cpAmount());
          cpValidate();
        });
        function openCollect() {
          var due = dueNow();
          cpRow.setAttribute('data-due', due);
          cpInput.value = usd(due); cpInput.setAttribute('data-touched', '0');
          cdlg.classList.remove('is-processing');
          // Every open starts from the default: credit card, first saved card, no half-filled new card.
          qa('input[name=method]').forEach(function (m) { m.checked = m.value === 'card'; });
          savedCards().forEach(function (c, i) { c.setAttribute('aria-checked', String(i === 0)); });
          newCard.reset(); renderBrand(); touchedCard = {};
          qa('[aria-invalid]', newCard).forEach(function (i) { i.removeAttribute('aria-invalid'); });
          qa('.co-field__err', newCard).forEach(function (n) { n.textContent = ''; });
          countrySel.value = 'CA'; applyCountry('CA');
          closeNewCard(); syncMethods();
          cpValidate();
          cdlg.showModal();
          focusPlain(cpInput);
        }
        cpPay.addEventListener('click', function () {
          if (qs('input[name=method]:checked').value === 'card' && !newCard.hidden) {
            if (!validateNewCard()) return;
            commitNewCard();
          }
          var paid = cpAmount(), due = parseFloat(cpRow.getAttribute('data-due'));
          var method = 'ACH \u00b7\u00b7\u00b7\u00b7 1204', brand = '';
          if (qs('input[name=method]:checked').value === 'card') {
            var pick = savedCards().filter(function (c) { return c.getAttribute('aria-checked') === 'true'; })[0];
            method = 'CC \u00b7\u00b7\u00b7\u00b7 ' + (pick ? pick.dataset.last4 : ''); brand = pick ? pick.dataset.brand || '' : '';
          }
          cdlg.classList.add('is-processing');
          runPaymentProgress(function () {
            applyPayment(paid, due);
            toast('Payment of ' + usd(paid) + ' successful');
          });
        });
      })();
    </script>
  </body>
</html>
