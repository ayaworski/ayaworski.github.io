    <div class="cf-page">
      <header class="cf-header iv-header">
        <div class="co-brand">
          <img class="co-brand__logo" src="images/checkout/logo-bitmap2.webp" alt="" />
          <span>Thirty Three Threads</span>
        </div>
        <div class="iv-user">
          <span class="iv-user__avatar" aria-hidden="true">BR</span>
          Brand Rep
        </div>
      </header>

      <main class="id-page" id="id-main"></main>
    </div>

    <dialog class="iv-modal" id="iv-record-dlg" aria-labelledby="iv-record-title">
      <form method="dialog" class="iv-modal__form" id="iv-record-form">
        <div class="iv-modal__head">
          <h2 id="iv-record-title">Record payment</h2>
          <button type="button" class="iv-actions__close" data-close aria-label="Close"><img src="images/checkout/x-mark.svg" alt="" /></button>
        </div>
        <div id="iv-record-groups"></div>
        <label class="iv-modal__email"><input type="checkbox" class="co-check" checked /> Send a payment confirmation email to the buyer.</label>
        <div class="iv-modal__foot">
          <button type="button" class="co-btn co-btn--ghost iv-modal__btn" data-close>Cancel</button>
          <button type="submit" class="co-btn co-btn--primary iv-modal__btn" id="iv-submit" disabled>Record Payment</button>
        </div>
      </form>
      <div class="iv-cal" id="iv-cal" role="dialog" aria-label="Choose date" hidden>
        <div class="iv-cal__head">
          <button type="button" class="iv-cal__label" id="iv-cal-label" aria-expanded="false">Month <img src="images/checkout/chevron-down.svg" alt="" /></button>
          <span class="iv-cal__nav" id="iv-cal-nav">
            <button type="button" data-step="-1" aria-label="Previous month"><img src="images/checkout/chevron-down.svg" alt="" style="transform: rotate(90deg)" /></button>
            <button type="button" data-step="1" aria-label="Next month"><img src="images/checkout/chevron-down.svg" alt="" style="transform: rotate(-90deg)" /></button>
          </span>
        </div>
        <div id="iv-cal-days">
          <div class="iv-cal__week" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
          <div class="iv-cal__grid" id="iv-cal-grid"></div>
        </div>
        <div class="iv-cal__years" id="iv-cal-years" hidden></div>
      </div>
      <div class="iv-menu" id="iv-menu" role="listbox" aria-label="Payment method" hidden></div>
    </dialog>

    <dialog class="iv-modal iv-modal--send" id="iv-send-dlg" aria-labelledby="iv-send-title">
      <form method="dialog" class="iv-send" id="iv-send-form" novalidate>
        <div class="iv-send__head">
          <h2 id="iv-send-title">Send invoice by email</h2>
          <button type="button" class="iv-actions__close" data-close-send aria-label="Close"><img src="images/checkout/x-mark.svg" alt="" /></button>
        </div>
        <div class="iv-send__body">
          <div class="iv-send__card iv-send__fields">
            <div class="iv-sf"><label for="sf-from">From</label><input id="sf-from" class="iv-field iv-field--ro" value="sales@33threads.com" readonly /></div>
            <div class="iv-sf"><label for="sf-to">To <span class="iv-req" aria-hidden="true">*</span></label><input id="sf-to" class="iv-field" type="text" inputmode="email" autocomplete="off" required aria-describedby="sf-to-err" aria-invalid="false" /><span class="iv-err" id="sf-to-err" role="alert"></span></div>
            <div class="iv-sf"><label for="sf-cc">Cc</label><input id="sf-cc" class="iv-field" type="text" autocomplete="off" /></div>
            <div class="iv-sf"><label for="sf-subject">Subject <span class="iv-req" aria-hidden="true">*</span></label><input id="sf-subject" class="iv-field" type="text" autocomplete="off" required /></div>
            <div class="iv-sf"><label for="sf-msg">Personal message <span class="iv-req" aria-hidden="true">*</span></label><textarea id="sf-msg" class="iv-field iv-field--area" rows="4" required></textarea></div>
          </div>
          <div class="iv-send__card iv-mail" aria-label="Email preview">

              <p><strong>From:</strong> Jane Doe &lt;sales@33threads.com&gt;</p>

              <p><strong>Subject:</strong> <span id="mp-subject"></span></p>

              <div class="iv-mail__list" id="mp-list"></div>

              <div class="iv-mail__foot">
                <p>Powered by <img src="images/checkout/ls-logo.svg" alt="Lightspeed" /></p>
                <p class="iv-mail__copy">Copyright NuOrder by Lightspeed</p>

            </div>

        <div class="iv-send__foot">

        </div>
      </form>
    </dialog>

    <dialog class="iv-modal iv-modal--collect is-step2" id="iv-collect-dlg" aria-labelledby="cp-title">
      <div class="iv-modal__form" id="iv-cp">
        <div class="iv-modal__head">
          <h2 id="cp-title">Collect payment</h2>
          <button type="button" class="iv-actions__close" data-close-cp aria-label="Close"><img src="images/checkout/x-mark.svg" alt="" /></button>
        </div>

        <!-- Step 2: the same payment module as checkout (saved methods, or a new card inline) -->
        <div id="cp-step2">
          <div class="iv-cp__amt" id="cp-amt" data-due="0">
            <label class="iv-cp__amtlabel" for="cp-amt-input">Payment amount:</label>
            <label class="iv-amount"><span>USD</span><input type="text" inputmode="decimal" class="iv-amount__input" id="cp-amt-input" autocomplete="off" /></label>
            <span class="iv-amount__err" id="cp-amt-err" role="alert"></span>
          </div>
          <div class="co-methods" id="methods" role="radiogroup" aria-label="Payment method">
            <div class="co-method" data-open="false" data-method="ach">
              <label class="co-method__head">
                <input type="radio" class="co-radio" name="method" value="ach" />
                <span class="co-method__name">ACH payment</span>
              </label>
              <div class="co-method__panel" hidden>
                <div class="co-bank">
                  <span class="co-bank__icon">ACH</span>
                  <span>Business chequing ending ···· 1204</span>
                </div>
              </div>
            </div>

            <div class="co-method" data-open="true" data-method="card">
              <label class="co-method__head">
                <input type="radio" class="co-radio" name="method" value="card" checked />
                <span class="co-method__name">Credit card</span>
                <span class="co-brands" aria-hidden="true">
                  <span class="co-brand-chip"><img src="images/checkout/visa-sm.svg" alt="" /></span>
                  <span class="co-brand-chip">
                    <span class="co-brand-chip__base"></span>
                    <span class="co-brand-chip__glyph co-brand-chip__glyph--mc"><img src="images/checkout/mastercard-sm-glyph.svg" alt="" /></span>
                  </span>
                  <span class="co-brand-chip"><img src="images/checkout/amex-sm.svg" alt="" /></span>
                  <span class="co-brand-chip">
                    <span class="co-brand-chip__base"></span>
                    <span class="co-brand-chip__glyph co-brand-chip__glyph--disc"><img src="images/checkout/discover-glyph.svg" alt="" /></span>
                  </span>
                </span>
              </label>

              <div class="co-method__panel" id="card-panel" role="radiogroup" aria-label="Saved cards">
                <button type="button" class="co-card" role="radio" aria-checked="true" data-last4="3435" data-brand="visa">
                  <span class="co-card__mark"><img src="images/checkout/visa-card.svg" alt="Visa" /></span>
                  <span class="co-card__info">ending ···· 3435 <span class="co-card__nick">Marketing</span></span>
                </button>
                <button type="button" class="co-card" role="radio" aria-checked="false" data-last4="4391" data-brand="mastercard">
                  <span class="co-card__mark">
                    <span class="co-brand-chip__base"></span>
                    <span class="co-brand-chip__glyph co-brand-chip__glyph--mc"><img src="images/checkout/mastercard-glyph.svg" alt="Mastercard" /></span>
                  </span>
                  <span class="co-card__info">ending ···· 4391 <span class="co-card__nick">Operations</span></span>
                </button>
                <button type="button" class="co-card" role="radio" aria-checked="false" data-last4="7718" data-brand="mastercard">
                  <span class="co-card__mark">
                    <span class="co-brand-chip__base"></span>
                    <span class="co-brand-chip__glyph co-brand-chip__glyph--mc"><img src="images/checkout/mastercard-glyph.svg" alt="Mastercard" /></span>
                  </span>
                  <span class="co-card__info">ending ···· 7718 <span class="co-card__nick">Backup</span></span>
                </button>
                <button type="button" class="co-card co-card--add" id="add-card" aria-expanded="false" aria-controls="new-card">
                  <span class="co-plus" aria-hidden="true">+</span>
                  <span class="co-card__info">Enter a different credit card</span>
                </button>

                <form class="co-newcard" id="new-card" hidden novalidate>
                  <div class="co-field co-field--wide">
                    <label for="nc-num">Card number</label>
                    <div class="co-field__wrap">
                      <input id="nc-num" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" />
                      <span class="co-field__brand" id="nc-brand" aria-live="polite"></span>
                    </div>
                    <span class="co-field__err" data-err="nc-num"></span>
                  </div>
                  <div class="co-field">
                    <label for="nc-exp">Expiration date</label>
                    <input id="nc-exp" inputmode="numeric" autocomplete="off" placeholder="MM / YY" />
                    <span class="co-field__err" data-err="nc-exp"></span>
                  </div>
                  <div class="co-field">
                    <label for="nc-cvc">Security code</label>
                    <div class="co-field__wrap">
                      <input id="nc-cvc" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="CVC" />
                      <span class="co-field__brand" aria-hidden="true">
                        <svg width="19" height="20" viewBox="0 0 19 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <rect x="0.5" y="2.5" width="18" height="15" rx="2" fill="#fff" stroke="#A2A3A3"/>
                          <rect x="0.5" y="5" width="18" height="3" fill="#A2A3A3"/>
                          <text x="17" y="15.2" text-anchor="end" font-family="Lato, sans-serif" font-size="5.5" font-weight="700" fill="#5D5E5E">123</text>
                        </svg>
                      </span>
                    </div>
                    <span class="co-field__err" data-err="nc-cvc"></span>
                  </div>
                  <div class="co-field">
                    <label for="nc-country">Country</label>
                    <select id="nc-country" class="co-select" autocomplete="country">
                      <option value="CA">Canada</option>
                      <option value="US">United States</option>
                    </select>
                  </div>
                  <div class="co-field">
                    <label for="nc-zip" id="nc-zip-label">Postal code</label>
                    <input id="nc-zip" autocomplete="off" />
                    <span class="co-field__err" data-err="nc-zip"></span>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div class="iv-cp__foot">
          <span></span>
          <span class="iv-cp__btns">
            <button type="button" class="co-btn co-btn--ghost iv-modal__btn" data-close-cp>Cancel</button>
            <button type="button" class="co-btn co-btn--primary iv-modal__btn" id="cp-pay" disabled>Pay</button>
          </span>
        </div>

        <!-- Same processing graphic as checkout: a spinner that closes into a ring, then draws the check.
             It lives in this dialog so the dialog can shrink into the confirmation card. -->
        <div class="co-done__card iv-cp__done" id="done-card" role="status" aria-live="polite">
          <svg class="co-done__icon" id="done-icon" width="108" height="108" viewBox="0 0 108 108" fill="none" aria-hidden="true">
            <circle class="co-done__ring" cx="54" cy="54" r="50" />
            <path class="co-done__check" d="M36 56 L49 69 L74 42" />
          </svg>
          <p class="co-done__status" id="done-title">Processing payment</p>
        </div>
      </div>
    </dialog>

    <div class="iv-toast" id="iv-toast" role="status" aria-live="polite" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 13.6 4.4 10l-1.1 1.1L8 15.8l9-9-1.1-1.1z" /></svg>
      <span id="iv-toast-msg"></span>
      <button type="button" id="iv-toast-close" aria-label="Dismiss"><img src="images/checkout/x-mark.svg" alt="" /></button>
    </div>

    <script>
      (function () {
        var $ = function (s) { return document.querySelector(s); };
        var esc = function (v) { return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var money = function (c) { return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
        var cents = function (str) { return Math.round((parseFloat(String(str).replace(/[$,]/g, '')) || 0) * 100); };
        var BADGE = { Paid: 'success', Partial: 'caution', Overdue: 'danger', Open: 'info', Unsent: 'neutral' };

        /* The invoice list saves its rows (with their current status) when an invoice is opened. */
        var list = null;
        try { list = JSON.parse(sessionStorage.getItem('iv-list')); } catch (e) {}
        var id = new URLSearchParams(location.search).get('inv');
        var r = list && list.filter(function (x) { return x.inv === id; })[0];
        var main = $('#id-main');
        if (!r) {
          document.title = 'Invoice not found — NuORDER';
          main.innerHTML = '<a class="id-back" href="supplier-invoices.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>Invoices</a><h1 class="id-title">Invoice not found</h1><p>Open an invoice from the invoices list to see its details.</p>';
          return;
        }
        document.title = r.inv + ' — NuORDER';

        /* ---- Customer details (the list only carries name, contact and email) ---- */
        var CUST = {
          'Element Pilates Studio': { legal: 'Element Pilates LLP', a1: '123 Fake Street, Vancouver BC', a2: 'V6J 1J2, Canada', phone: '(604) 560-6548', cid: 'ELEM001' },
          'Core Pilates': { legal: 'Core Pilates Inc', a1: '88 Granville Street, Vancouver BC', a2: 'V6C 1T2, Canada', phone: '(604) 555-0142', cid: 'CORE001' },
          'Semperviva Yoga': { legal: 'Semperviva Yoga Ltd', a1: '1480 West 4th Avenue, Vancouver BC', a2: 'V6J 1L8, Canada', phone: '(604) 555-0167', cid: 'SEMP001' },
          'Y Yoga': { legal: 'Y Yoga Studios Inc', a1: '2121 Cornwall Avenue, Vancouver BC', a2: 'V6K 1B5, Canada', phone: '(604) 555-0188', cid: 'YYOG001' },
          'Lotus Barre Collective': { legal: 'Lotus Barre Collective Inc', a1: '350 Water Street, Vancouver BC', a2: 'V6B 1B8, Canada', phone: '(604) 555-0119', cid: 'LOTU001' }
        };
        var c = CUST[r.customer] || { legal: r.customer, a1: '', a2: '', phone: '', cid: r.customer.slice(0, 4).toUpperCase() + '001' };

        /* ---- Line items: products from the catalogue that add up to the invoice total ----
           Shipping is a flat $25.00 and tax is $0.00; the product lines make up the rest. The last line carries
           any rounding as a line discount so the order summary always matches the list's total to the cent. */
        var CAT = [
          ['Half Toe Crew Grip Socks', 'Navy Vortex', 'half-toe-crew-grip-socks', 1100, true],
          ['Half Toe Low Rise Grip Socks', 'Candy Clause', 'half-toe-low-rise-grip-socks', 900, true],
          ['Half Toe Mia Grip Socks', 'Ebony Velvet', 'half-toe-mia-grip-socks', 1100, true],
          ['M8 Bottle with Sport Cap', 'Black', 'm8-bottle-with-sport-cap', 1200, false],
          ['V8 Bottle with Sport Cap', 'Soft Pink', 'v8-bottle-with-sport-cap', 2000, false],
          ['Katie Backpack', 'Violet Floral', 'vooray-katie-backpack-violet-floral', 2030, false],
          ['Half Toe Elle Grip Socks', 'Ash Polka Dots', 'half-toe-elle-grip-socks', 1100, true],
          ['Half Toe Ivy Grip Socks', 'Leaf', 'half-toe-ivy-grip-socks', 1200, true],
          ['Full Toe Low Rise Grip Socks', 'Candy Clause', 'full-toe-low-rise-grip-socks', 900, true],
          ['V7 Bottle with Straw Lid', 'Paradise Pink', 'v7-bottle-with-straw-lid', 2100, false],
          ['Essential Crossbody', 'Hazy Cream', 'essential-crossbody-hazy-cream', 2750, false],
          ['Burner Gym Duffel', 'Checkmate', 'burner-gym-duffel-checkmate', 3400, false]
        ];
        /* ---- Payment records ----
           Seeded once per invoice from its status (paid in full, part-paid, a failed attempt on an overdue one,
           a pending ACH on some open ones), then added to whenever a payment is collected or recorded. */
        var MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
        var parseD = function (str) { return new Date(String(str).replace('Sept', 'Sep') + ' 12:00:00'); };
        function fmtTs(iso) {
          var d = new Date(iso), h = d.getHours(), m = ('0' + d.getMinutes()).slice(-2);
          return MONS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ', ' + ((h + 11) % 12 + 1) + ':' + m + ' ' + (h < 12 ? 'a.m.' : 'p.m.');
        }
        function txnNo(n) { return 'TXN-' + String(10000000 + (parseInt(r.inv.slice(4), 10) * 7919 + n * 104729) % 90000000); }
        /* Payment type shown with the checkout's own marks: the ACH chip, or the card brand mark. */
        var BRANDS_BY_LAST4 = { '3435': 'visa', '4391': 'mastercard', '7718': 'mastercard' };
        function typeMark(p) {
          var m = p.method || '';
          if (/^ACH/.test(m)) return '<span class="id-ptype"><span class="co-bank__icon">ACH</span><span>' + esc(m.replace(/^ACH\s*/, '')) + '</span></span>';
          if (/^CC/.test(m)) {
            var last = m.slice(-4), b = p.brand || BRANDS_BY_LAST4[last] || '', mark;
            var glyph = function (cls, src) { return '<span class="co-brand-chip__base"></span><span class="co-brand-chip__glyph ' + cls + '"><img src="' + src + '" alt="" /></span>'; };
            if (b === 'visa') mark = '<img src="images/checkout/visa-card.svg" alt="Visa" />';
            else if (b === 'amex') mark = '<img src="images/checkout/amex-sm.svg" alt="American Express" />';
            else if (b === 'mastercard') mark = glyph('co-brand-chip__glyph--mc', 'images/checkout/mastercard-glyph.svg');
            else if (b === 'discover') mark = glyph('co-brand-chip__glyph--disc', 'images/checkout/discover-glyph.svg');
            else mark = '<span class="co-brand-chip__base"></span>';
            return '<span class="id-ptype"><span class="co-card__mark" title="Credit card">' + mark + '</span><span>···· ' + esc(last) + '</span></span>';
          }
          return esc(m || '—');
        }
        function seedPays() {
          var sd = parseInt(r.inv.slice(4), 10), tot = cents(r.total), dueC = cents(r.amount), nowD = new Date(), out = [], k = 0;
          var at = function (d, dh) { var x = new Date(d.getTime()); x.setHours(9 + (sd % 8) + (dh || 0), (sd * 7) % 60, 0, 0); return x.toISOString(); };
          var CCS = ['3435', '4391', '7718'];

          var btn = openFor; btn.value = item.getAttribute('data-v'); btn.textContent = btn.value;
          btn.dispatchEvent(new Event('change', { bubbles: true }));
          closePopups(true);
        }
        menu.addEventListener('click', function (e) { var it = e.target.closest('.iv-menu__item'); if (it) pick(it); });
        menu.addEventListener('keydown', function (e) {
          var items = Array.prototype.slice.call(menu.children), i = items.indexOf(document.activeElement);
          if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, i + 1)].focus(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(0, i - 1)].focus(); }
          else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
          else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
          else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (i > -1) pick(items[i]); }
          else if (e.key === 'Tab') closePopups();
        });

        groupsEl.addEventListener('click', function (e) {
          var t = e.target;
          if (t.classList.contains('iv-date')) { openFor === t ? closePopups() : openCal(t); }
          else if (t.classList.contains('iv-method')) { openFor === t ? closePopups() : openMenu(t); }
        });
        groupsEl.addEventListener('keydown', function (e) {
          if (e.target.classList.contains('iv-method') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); openMenu(e.target); }
          if (e.target.classList.contains('iv-date') && (e.key === 'ArrowDown' || (e.key === 'Enter' && e.altKey))) { e.preventDefault(); openCal(e.target); }
        });
        // A typed date is accepted when it is a real MM/DD/YYYY date; otherwise the field goes back to its last valid value.
        groupsEl.addEventListener('focusout', function (e) {
          var t = e.target;
          if (!t.classList.contains('iv-date') || cal.contains(e.relatedTarget)) return;
          var iso = parseUS(t.value);
          if (iso) setDate(t, iso); else t.value = t.getAttribute('data-iso') ? fmtUS(t.getAttribute('data-iso')) : '';
        });
        dlg.addEventListener('cancel', function (e) { if (openFor) { e.preventDefault(); closePopups(true); } });
        dlg.addEventListener('scroll', function () { closePopups(); });
        dlg.addEventListener('close', function () { closePopups(); });
        Array.prototype.forEach.call(dlg.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', function () { dlg.close(); }); });
        dlg.addEventListener('click', function (e) {
          if (e.target === dlg) { dlg.close(); return; }
          if (openFor && !e.target.closest('#iv-cal, #iv-menu, .iv-date, .iv-method')) closePopups();
        });

        qa('[data-close-cp]', cdlg).forEach(function (b) { b.addEventListener('click', function () { cdlg.close(); }); });
        cdlg.addEventListener('click', function (e) { if (e.target === cdlg && !cdlg.classList.contains('is-processing')) cdlg.close(); });
        cdlg.addEventListener('cancel', function (e) { if (cdlg.classList.contains('is-processing')) e.preventDefault(); });
        /* ---- Payment module (ported from checkout) ---- */
        var methodRadios = qa('input[name=method]');
        function syncMethods() {
          qa('.co-method').forEach(function (m) {
            var r = qs('input[name=method]', m), open = r && r.checked;
            m.dataset.open = open;
            var panel = qs('.co-method__panel', m);
            if (panel) panel.hidden = !open;
          });
          updatePay();
        }
        methodRadios.forEach(function (r) { r.addEventListener('change', syncMethods); });

        var cardPanel = $('#card-panel'), newCard = $('#new-card'), addBtn = $('#add-card');
        var savedCards = function () { return qa('.co-card[role=radio]', cardPanel); };
        function methodReady() {
          if (qs('input[name=method]:checked').value !== 'card') return true;
          // With the new-card form open, the button waits for every field to pass validation.
          if (!newCard.hidden) return newCardValid();
          return savedCards().some(function (c) { return c.getAttribute('aria-checked') === 'true'; });
        }
        function updatePay() { cpPay.disabled = !(methodReady() && !amountError(cpRow, COLLECT_MIN)); }
        function selectCard(btn) {
          savedCards().forEach(function (c) { c.setAttribute('aria-checked', String(c === btn)); });
          closeNewCard();
        }
        cardPanel.addEventListener('click', function (e) { var c = e.target.closest('.co-card[role=radio]'); if (c) selectCard(c); });
        function openNewCard() {
          savedCards().forEach(function (c) { c.setAttribute('aria-checked', 'false'); });
          newCard.hidden = false; addBtn.setAttribute('aria-expanded', 'true');
          $('#nc-num').focus(); updatePay();
        }
        function closeNewCard() { newCard.hidden = true; addBtn.setAttribute('aria-expanded', 'false'); updatePay(); }
        addBtn.addEventListener('click', function () { newCard.hidden ? openNewCard() : closeNewCard(); });

        var BRANDS = {
          visa: { name: 'Visa', len: 16, cvc: 3 },
          mastercard: { name: 'Mastercard', len: 16, cvc: 3 },
          amex: { name: 'American Express', len: 15, cvc: 4 },
          discover: { name: 'Discover', len: 16, cvc: 3 }
        };
        function detectBrand(d) {
          if (/^4/.test(d)) return 'visa';
          if (/^(5[1-5]|2(2[2-9][1-9]|2[3-9]|[3-6]|7[01]|720))/.test(d)) return 'mastercard';
          if (/^3[47]/.test(d)) return 'amex';
          if (/^(6011|65|64[4-9]|622)/.test(d)) return 'discover';
          return null;
        }
        function brandMark(brand) {
          var mark = mk('span', 'co-card__mark');
          function base() { mark.appendChild(mk('span', 'co-brand-chip__base')); }
          function glyph(cls, src, alt) { var g = mk('span', 'co-brand-chip__glyph ' + cls), i = mk('img'); i.src = src; i.alt = alt; g.appendChild(i); mark.appendChild(g); }
          function full(src, alt) { var i = mk('img'); i.src = src; i.alt = alt; mark.appendChild(i); }
          if (brand === 'visa') full('images/checkout/visa-card.svg', 'Visa');
          else if (brand === 'amex') full('images/checkout/amex-sm.svg', 'American Express');
          else if (brand === 'mastercard') { base(); glyph('co-brand-chip__glyph--mc', 'images/checkout/mastercard-glyph.svg', 'Mastercard'); }
          else if (brand === 'discover') { base(); glyph('co-brand-chip__glyph--disc', 'images/checkout/discover-glyph.svg', 'Discover'); }
          else base();
          return mark;
        }
        var ncNum = $('#nc-num'), ncCvc = $('#nc-cvc');
        ncCvc.addEventListener('input', function () { var clean = ncCvc.value.replace(/\D/g, ''); if (clean !== ncCvc.value) ncCvc.value = clean; });
        function renderBrand() {
          var brand = detectBrand(ncNum.value.replace(/\D/g, '')), slot = $('#nc-brand');
          slot.textContent = ''; slot.dataset.brand = brand || '';
          if (brand) slot.appendChild(brandMark(brand));
          ncCvc.maxLength = brand === 'amex' ? 4 : 3;
          return brand;
        }
        ncNum.addEventListener('input', function () {
          var brand = detectBrand(ncNum.value.replace(/\D/g, ''));
          var d = ncNum.value.replace(/\D/g, '').slice(0, brand === 'amex' ? 15 : 16);
          ncNum.value = brand === 'amex' ? [d.slice(0, 4), d.slice(4, 10), d.slice(10)].filter(Boolean).join(' ') : d.replace(/(.{4})/g, '$1 ').trim();
          renderBrand();
        });
        $('#nc-exp').addEventListener('input', function (e) {
          var d = e.target.value.replace(/\D/g, '').slice(0, 4);
          e.target.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d;
        });
        function setErr(id, msg) {
          var inp = $('#' + id);
          qs('[data-err=' + id + ']').textContent = msg;
          if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
          return !msg;
        }
        var POSTAL_LOCALES = {
          CA: { label: 'Postal code', inputmode: 'text', test: /^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z] \d[ABCEGHJ-NPRSTV-Z]\d$/,
                format: function (v) { var c = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); return c.length > 3 ? c.slice(0, 3) + ' ' + c.slice(3) : c; } },
          US: { label: 'Zip code', inputmode: 'numeric', test: /^\d{5}(-\d{4})?$/,
                format: function (v) { var d = v.replace(/\D/g, '').slice(0, 9); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; } }
        };
        var POSTAL_LOCALE, POSTAL, zipInput = $('#nc-zip'), countrySel = $('#nc-country');
        function applyCountry(code) {
          POSTAL_LOCALE = POSTAL_LOCALES[code] || POSTAL_LOCALES.US; POSTAL = POSTAL_LOCALE.test;
          $('#nc-zip-label').textContent = POSTAL_LOCALE.label;
          zipInput.setAttribute('inputmode', POSTAL_LOCALE.inputmode);
          zipInput.value = POSTAL_LOCALE.format(zipInput.value);
        }
        countrySel.value = 'CA'; applyCountry('CA');
        countrySel.addEventListener('change', function () { setErr('nc-zip', ''); zipInput.value = ''; applyCountry(countrySel.value); });
        zipInput.addEventListener('input', function () { zipInput.value = POSTAL_LOCALE.format(zipInput.value); });

        var CHECKS = {
          'nc-num': function () { var d = $('#nc-num').value.replace(/\D/g, ''), b = detectBrand(d); return d.length < (b ? BRANDS[b].len : 16) ? 'Your card number is incomplete.' : ''; },
          'nc-exp': function () {
            var d = $('#nc-exp').value.replace(/\D/g, '');
            if (d.length < 4) return 'Your card’s expiration date is incomplete.';
            var mm = parseInt(d.slice(0, 2), 10), yy = 2000 + parseInt(d.slice(2), 10), now = new Date(), cy = now.getFullYear(), cm = now.getMonth() + 1;
            if (mm < 1 || mm > 12) return 'Your card’s expiration month is invalid.';
            if (yy < cy) return 'Your card’s expiration year is in the past.';
            if (yy > cy + 50) return 'Your card’s expiration year is invalid.';
            if (yy === cy && mm < cm) return 'Your card’s expiration date is in the past.';
            return '';
          },
          'nc-cvc': function () { var b = detectBrand($('#nc-num').value.replace(/\D/g, '')); return $('#nc-cvc').value.length < (b ? BRANDS[b].cvc : 3) ? 'Your security code is incomplete.' : ''; },
          'nc-zip': function () {
            var v = $('#nc-zip').value.trim(), name = POSTAL_LOCALE.label.toLowerCase();
            if (!v) return 'Your ' + name + ' is incomplete.';
            return POSTAL.test(v) ? '' : 'Your ' + name + ' is invalid.';
          }
        };
        var touchedCard = {};
        function checkField(id) { return setErr(id, CHECKS[id]()); }
        Object.keys(CHECKS).forEach(function (id) {
          var input = $('#' + id), errEl = qs('[data-err=' + id + ']');
          errEl.id = 'err-' + id; input.setAttribute('aria-describedby', errEl.id);
          input.addEventListener('blur', function () { touchedCard[id] = true; checkField(id); });
          input.addEventListener('input', function () { if (touchedCard[id]) checkField(id); });
          input.addEventListener('input', updatePay);
        });
        ncNum.addEventListener('input', function () {
          var d = ncNum.value.replace(/\D/g, ''), b = detectBrand(d);
          if (!touchedCard['nc-num'] && d.length >= (b ? BRANDS[b].len : 16)) { touchedCard['nc-num'] = true; checkField('nc-num'); }
          if (touchedCard['nc-cvc']) checkField('nc-cvc');
        });
        countrySel.addEventListener('change', function () { touchedCard['nc-zip'] = false; updatePay(); });
        // True when every new-card field passes its inline check (nothing is shown; the button just follows).
        function newCardValid() { return Object.keys(CHECKS).every(function (id) { return CHECKS[id]() === ''; }); }
        function validateNewCard() {
          var firstBad = null;
          Object.keys(CHECKS).forEach(function (id) { touchedCard[id] = true; if (!checkField(id) && !firstBad) firstBad = id; });
          if (firstBad) $('#' + firstBad).focus();
          return !firstBad;
        }
        /* Entering valid card details is enough: there is no accept/cancel step. The main button saves the card and uses it. */
        function commitNewCard() {
          var num = $('#nc-num').value.replace(/\D/g, ''), btn = mk('button', 'co-card');
          btn.type = 'button'; btn.setAttribute('role', 'radio'); btn.dataset.last4 = num.slice(-4);
          var brand = detectBrand(num); if (brand) btn.dataset.brand = brand;
          btn.appendChild(brandMark(brand));
          btn.appendChild(mk('span', 'co-card__info', 'ending ···· ' + num.slice(-4)));
          addBtn.parentNode.insertBefore(btn, addBtn);
          newCard.reset(); renderBrand(); touchedCard = {};
          qa('[aria-invalid]', newCard).forEach(function (i) { i.removeAttribute('aria-invalid'); });
          qa('.co-field__err', newCard).forEach(function (n) { n.textContent = ''; });
          selectCard(btn);
        }
        newCard.addEventListener('submit', function (e) { e.preventDefault(); });


        /* Processing -> successful: the spinner finishes its turn, closes into a green ring and draws the check,
           then the dialog closes and `onDone` returns the user to the list. */
        var doneCard = $('#done-card'), doneIcon = $('#done-icon'), doneText = $('#done-title');
        var doneReady = false, doneFinished = false, doneTimers = [], doneCb = null;
        function later(fn, ms) { doneTimers.push(setTimeout(fn, ms)); }
        function finishPayment() {
          if (doneFinished) return;
          doneFinished = true;
          doneCard.classList.remove('is-processing');
          doneCard.classList.add('is-complete');
          doneText.textContent = 'Payment successful';
          later(function () {
            cdlg.close();
            var cb = doneCb; doneCb = null;
            if (cb) cb();
          }, 1600);
        }
        function runPaymentProgress(onDone) {
          doneTimers.forEach(clearTimeout); doneTimers = [];
          doneReady = false; doneFinished = false; doneCb = onDone;
          doneCard.className = 'co-done__card iv-cp__done is-processing';
          doneText.textContent = 'Processing payment';
          later(function () { doneReady = true; }, 2200);
          later(finishPayment, 3600); // fallback when animations are off (reduced motion)
        }
        doneIcon.addEventListener('animationiteration', function () { if (doneReady) finishPayment(); });
        syncMethods();


        /* Record payment */
        function openRecord() {
          var due = dueNow();
          $('#iv-record-title').textContent = 'Record payment';
          groupsEl.innerHTML = '<section class="iv-pay"><h3 class="iv-pay__name">' + esc(r.customer) + '</h3>' +
            '<div class="iv-pay__row iv-pay__row--head"><span>Invoice #</span><span>Payment date</span><span>Internal note</span><span>Payment method</span><span class="iv-num">Payment amount</span></div>' +
            '<div class="iv-pay__row" data-i="0" data-due="' + due + '">' +
              '<span>' + esc(r.inv) + '</span>' +
              '<span><input type="text" class="iv-field iv-date" value="' + fmtUS(isoToday) + '" data-iso="' + isoToday + '" inputmode="numeric" placeholder="MM/DD/YYYY" aria-haspopup="dialog" aria-label="Payment date for ' + esc(r.inv) + '" /></span>' +
              '<span><input type="text" class="iv-field" placeholder="Optional note here" aria-label="Internal note for ' + esc(r.inv) + '" /></span>' +
              '<span><button type="button" class="iv-field iv-select iv-method is-empty" value="" aria-haspopup="listbox" aria-expanded="false" aria-label="Payment method for ' + esc(r.inv) + '">Select method</button></span>' +
              '<span><label class="iv-amount"><span>USD</span><input type="text" inputmode="decimal" class="iv-amount__input" value="' + esc(usd(due)) + '" aria-label="Payment amount for ' + esc(r.inv) + '" /></label><span class="iv-amount__err" role="alert"></span></span>' +
            '</div></section>';
          validate();
          dlg.showModal();
          var firstField = groupsEl.querySelector('.iv-date'); if (firstField) focusPlain(firstField);
        }
        $('#iv-record-form').addEventListener('submit', function () {
          var row = groupsEl.querySelector('.iv-pay__row[data-i]'), paid = parseFloat(row.querySelector('.iv-amount__input').value.replace(/[$,\s]/g, ''));
          applyPayment(paid, parseFloat(row.getAttribute('data-due')), row.querySelector('.iv-method').value);
          toast('Payment of ' + usd(paid) + ' recorded');
        });

        /* Send invoice */
        var sdlg = $('#iv-send-dlg'), sTo = $('#sf-to'), sSub = $('#sf-subject'), sMsg = $('#sf-msg');
        var EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;.]{2,}$/;
        function syncSend() {
          var to = sTo.value.trim(), sub = sSub.value.trim(), msg = sMsg.value.trim();
          var toErr = !to ? 'Enter an email address.' : !EMAIL_RE.test(to) ? 'Enter a valid email address, like name@example.com.' : '';
          var show = sTo.getAttribute('data-touched') === '1' && !!toErr;
          $('#sf-to-err').textContent = show ? toErr : '';
          sTo.setAttribute('aria-invalid', String(show));
          sTo.classList.toggle('is-invalid', show);
          $('#iv-send-go').disabled = !(!toErr && sub && msg);
          [['#mp-to', to, 'name@email.com'], ['#mp-subject', sub, 'email subject'], ['#mp-msg', sMsg.value, 'Personal message appears here']].forEach(function (x) {
            var el = $(x[0]); el.textContent = x[1] ? x[1] : x[2]; el.classList.toggle('is-placeholder', !x[1]);
          });
        }
        function openSend() {
          sTo.setAttribute('data-touched', '0'); sTo.value = r.email; sSub.value = ''; sMsg.value = ''; $('#sf-cc').value = '';
          $('#mp-list').innerHTML = '<div class="iv-mail__row iv-mail__row--head"><span>Invoice #</span><span>Status</span><span class="iv-num">Amount due</span></div>' +
            '<div class="iv-mail__row"><span><span class="iv-mail__link">' + esc(r.inv) + '</span></span><span><span class="cf-badge cf-badge--' + BADGE[r.status] + '">' + esc(r.status) + '</span></span><span class="iv-num">' + esc(usd(dueNow())) + '</span></div>';
          $('#mp-total').textContent = usd(dueNow());
          syncSend(); sdlg.showModal(); focusPlain(sTo);
        }
        [sTo, sSub, sMsg].forEach(function (el) { el.addEventListener('input', syncSend); });
        sTo.addEventListener('blur', function () { sTo.setAttribute('data-touched', '1'); syncSend(); });
        qa('[data-close-send]', sdlg).forEach(function (b) { b.addEventListener('click', function () { sdlg.close(); }); });
        sdlg.addEventListener('click', function (e) { if (e.target === sdlg) sdlg.close(); });
        $('#iv-send-form').addEventListener('submit', function (e) {
          var to = sTo.value.trim();
          if (!EMAIL_RE.test(to)) { e.preventDefault(); sTo.setAttribute('data-touched', '1'); syncSend(); sTo.focus(); return; }
          toast('Invoice sent to ' + to);
        });

        /* Collect payment: the checkout payment module for this one invoice, with an editable amount (full balance to start). */
        function cpAmount() { return parseFloat(cpInput.value.replace(/[$,\s]/g, '')); }
        function cpValidate() {
          var err = amountError(cpRow, COLLECT_MIN), shown = cpInput.getAttribute('data-touched') === '1' && !!err;
          $('#cp-amt-err').textContent = shown ? err : '';
          cpInput.parentNode.classList.toggle('is-invalid', shown);
          cpInput.setAttribute('aria-invalid', String(shown));
          cpPay.textContent = err ? 'Pay' : 'Pay ' + usd(cpAmount());
          updatePay();
        }
        cpInput.addEventListener('input', function () { cpInput.setAttribute('data-touched', '1'); cpValidate(); });
        cpInput.addEventListener('focusout', function () {
          cpInput.setAttribute('data-touched', '1');
          if (!amountError(cpRow, COLLECT_MIN)) cpInput.value = usd(cpAmount());
          cpValidate();
        });
        function openCollect() {
          var due = dueNow();
          cpRow.setAttribute('data-due', due);
          cpInput.value = usd(due); cpInput.setAttribute('data-touched', '0');
          cdlg.classList.remove('is-processing');
          // Every open starts from the default: credit card, first saved card, no half-filled new card.
          qa('input[name=method]').forEach(function (m) { m.checked = m.value === 'card'; });
          savedCards().forEach(function (c, i) { c.setAttribute('aria-checked', String(i === 0)); });
          newCard.reset(); renderBrand(); touchedCard = {};
          qa('[aria-invalid]', newCard).forEach(function (i) { i.removeAttribute('aria-invalid'); });
          qa('.co-field__err', newCard).forEach(function (n) { n.textContent = ''; });
          countrySel.value = 'CA'; applyCountry('CA');
          closeNewCard(); syncMethods();
          cpValidate();
          cdlg.showModal();
          focusPlain(cpInput);
        }
        cpPay.addEventListener('click', function () {
          if (qs('input[name=method]:checked').value === 'card' && !newCard.hidden) {
            if (!validateNewCard()) return;
            commitNewCard();
          }
          var paid = cpAmount(), due = parseFloat(cpRow.getAttribute('data-due'));
          var method = 'ACH \u00b7\u00b7\u00b7\u00b7 1204', brand = '';
          if (qs('input[name=method]:checked').value === 'card') {
            var pick = savedCards().filter(function (c) { return c.getAttribute('aria-checked') === 'true'; })[0];
            method = 'CC \u00b7\u00b7\u00b7\u00b7 ' + (pick ? pick.dataset.last4 : ''); brand = pick ? pick.dataset.brand || '' : '';
          }
          cdlg.classList.add('is-processing');
          runPaymentProgress(function () {
            applyPayment(paid, due, method, brand);
            toast('Payment of ' + usd(paid) + ' successful');
          });
        });
      })();
    </script>
  </body>
</html>
