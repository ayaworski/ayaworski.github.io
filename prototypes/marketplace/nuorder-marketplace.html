<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NuORDER Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#2d2d2d; --rail-home:#171717; --accent:#3a1afe; --accent-hover:#2a0fc4; --tint:#e4e7f5; --tint-press:#d3d7ec;
  --bg:#f3f3f6; --surface:#fff; --fg:#1d1f23; --muted:#5d6068; --line:#dcdce2; --chip:#e4e7f5; --chip-hover:#d3d7ec;
  --font:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:60px minmax(0,1fr);width:1440px;height:100%;margin:0 auto}
.main{background:var(--bg)}
body{min-width:1440px;overflow-x:auto}

/* ---- left rail (from nuo-portal.html) ---- */
.rail{background:var(--rail);overflow-y:auto;overflow-x:hidden}
.rail-in{position:relative;width:60px;height:100%;min-height:640px}
.rhome{position:absolute;left:0;top:0;width:60px;height:60px;background:var(--rail-home)}
.ractive{position:absolute;left:0;width:60px;height:60px;background:rgba(88,88,88,.3)}
.ri{position:absolute;display:block;outline:none}
.ri img{position:absolute;inset:0;width:100%;height:100%}
.ri::before{content:"";position:absolute;left:-14px;right:-14px;top:-12px;bottom:-12px}
.ri:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:3px}
.ri::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#000;color:#fff;padding:5px 9px;border-radius:5px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.ri:hover::after,.ri:focus-visible::after{opacity:1}
.ravatar{position:absolute;left:10px;bottom:35px;width:40px;height:76px;color:#fff}
.roval{position:absolute;left:0;top:0;width:40px;height:40px}
.rmark{position:absolute;left:4px;top:60px;width:32px;height:16px}
.ravatar span{position:absolute;left:0;right:0;top:7px;text-align:center;font-size:20px;line-height:24px;letter-spacing:.25px}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);height:60px;padding:0 20px 0 35px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:.2px}
.logo img{width:30px;height:15px;filter:invert(1)}
.user{position:relative}
.userbtn{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--fg);padding:6px 4px}
.userbtn svg{width:16px;height:16px;transition:transform .15s}
.userbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:40px;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu[hidden]{display:none}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 35px 24px 35px}
.wrap{width:100%}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* search row */
.bar{display:flex;gap:12px;align-items:stretch}
.dept{position:relative}
.deptbtn{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--chip);border:0;border-radius:4px;cursor:pointer;font-size:15px;font-weight:400;white-space:nowrap}
.deptbtn:hover{background:var(--chip-hover)}
.deptbtn svg{width:14px;height:14px;transition:transform .15s}
.deptbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dept .menu{left:0;right:auto;top:54px}
.dept .menu .on{font-weight:700;color:var(--accent)}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;left:16px;top:14px;width:20px;height:20px;color:#4a5c78;stroke-width:2.4}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 14px 0 46px;font:inherit;font-size:15px;color:var(--fg)}
.search input::placeholder{color:#4a5c78}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cart{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;background:var(--accent);color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:15px;font-variant-numeric:tabular-nums}
.cart:hover{background:var(--accent-hover)}
.cart svg{fill:currentColor;stroke:none;width:20px;height:20px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{height:48px;padding:0 16px;background:var(--chip);border:0;border-radius:4px;font-size:15px;cursor:pointer}
.chip:hover{background:var(--chip-hover)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}

h2{font-size:20px;font-weight:700;margin:0;letter-spacing:.1px}
.sec{margin-top:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.viewall{color:var(--accent);text-decoration:none;font-size:15px}
.viewall:hover{text-decoration:underline}

/* brands */
.brands{display:flex;flex-wrap:wrap;gap:14px}
.brand{position:relative;width:84px;height:84px;background:#fff;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;cursor:pointer;padding:0;overflow:visible}
.brand img{max-width:84%;max-height:70%;object-fit:contain;display:block}
.brand.full img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
.brand:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bcart{position:absolute;top:-7px;right:-8px;display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;background:var(--accent);color:#fff;border-radius:3px;font-size:13px;font-variant-numeric:tabular-nums}
.bcart svg{fill:currentColor;stroke:none;width:14px;height:14px}

/* products */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.card{min-width:0;cursor:pointer}
.ph{position:relative;aspect-ratio:323/430;background:#e8e8ec;border:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply;transition:transform .3s}
.card:hover .ph img{transform:scale(1.03)}
.tag{position:absolute;left:9px;top:9px;background:#e8e9ef;color:#2c3a54;font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 7px;border-radius:3px;text-transform:uppercase;z-index:1}
.heart{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);border:0;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:1}
.card:hover .heart,.heart.on{opacity:1}
.heart svg{width:18px;height:18px}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}
.pb{font-size:15px;color:var(--muted);margin:12px 0 2px;min-height:21px;letter-spacing:.1px}
.pn{font-size:15px;font-weight:700;margin:0;min-height:21px}
.ps{font-size:15px;color:var(--muted);margin:2px 0 8px}
.sw{display:flex;gap:8px;margin-bottom:10px}
.sw button{width:25px;height:25px;border:0;border-radius:2px;padding:0;cursor:pointer;outline-offset:2px}
.sw button[aria-pressed="true"]{outline:2px solid var(--fg)}
.price{font-size:14px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);margin-left:8px}
.empty{padding:30px 0;color:var(--muted)}

</style>
</head>

          </div>

          <button class="cart" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M1 2h4l.6 3H22l-2.200 9H8L5.100 3.800 4.600 2" opacity="0"/><path d="M1 3h3.500l.7 3H22l-2.200 9.500H7.800L4.300 3H1z"/><circle cx="9" cy="20" r="1.800"/><circle cx="18" cy="20" r="1.800"/></svg><span id="cartn">12</span></button>
        </div>

        </section>

        <section class="sec">
          <div class="sechead"><h2>Recently viewed</h2><a href="#" class="viewall">View all</a></div>

          <p class="empty" id="empty" hidden>No products match your search.</p>

<script>
const CART='<svg viewBox="0 0 24 24"><path d="M1 3h3.500l.7 3H22l-2.200 9.500H7.800L4.300 3H1z"/><circle cx="9" cy="20" r="1.800"/><circle cx="18" cy="20" r="1.800"/></svg>';
const depts=['Sports & Outdoor','Apparel','Footwear','Accessories','Home & Gear'];
const cats=['Camp & Hike','Climb','Cycle','Water','Run','Snow','Travel','Golf','Surf & Skate'];
const brands=[
 {n:'Burton',img:'images/outdoor/b-burton.png',cart:0,cats:['Snow','Surf & Skate']},
 {n:'Orage',img:'images/outdoor/b-orage.png',cart:3,cats:['Snow']},
 {n:'Helly Hansen',img:'images/outdoor/b-hh.png',cart:0,full:true,cats:['Water','Snow','Run']},
 {n:'The North Face',img:'images/outdoor/b-tnf.png',cart:9,cats:['Camp & Hike','Climb','Snow','Travel']}
];
const PR={p1:[449,560],p2:[179,225],p3:[249,310],p4:[389,485],p5:[139,175]};
const SW={p1:[['#c4466f','Berry'],['#1c1c1e','Black'],['#2b6a3e','Forest'],['#c8c2b4','Bone']],p2:[['#2a3fb0','Neptune'],['#1c2a44','Deep navy'],['#1c1c1e','Black'],['#9a1b2e','Garnet']],p3:[['#3d4a73','Atlantic'],['#1c1c1e','Black'],['#6b7a45','Olive'],['#a89d8a','Stone']],p4:[['#1f7a80','Balsam'],['#1c1c1e','Black'],['#4a5568','Steel'],['#d9a441','Gold']],p5:[['#b9b89a','Teak'],['#5d625a','Kambaba'],['#1c1c1e','Black'],['#d1432b','Red']]};
const products=[
 {b:"Arc'teryx",n:'Sentinel Jacket',img:'p1',best:1,cats:['Snow','Climb']},
 {b:'Ridgeline Co.',n:'Icefields Down Hooded Jacket',img:'p2',cats:['Snow','Climb']},
 {b:'Outdoor Research',n:'Snowcrew Down Jacket',img:'p3',bg:'#e3ddd3',cats:['Snow','Travel']},
 {b:'Ridgeline Co.',n:'Northern Light Hoodie',img:'p4',bg:'#d9dde0',best:1,cats:['Snow','Camp & Hike']},
 {b:'Karpos',n:'Storm 2.0 Jacket',img:'p5',cats:['Snow','Climb']}
];
const $=s=>document.querySelector(s);
let cat=null,total=12;

/* menus */
const dm=$('#dmenu');
dm.innerHTML=depts.map((d,i)=>`<button role="menuitem"${i?'':' class="on"'}>${d.replace(/&/g,'&amp;')}</button>`).join('');
function toggle(btn,menu,open){menu.hidden=!open;btn.setAttribute('aria-expanded',open)}
function closeAll(){toggle($('#ubtn'),$('#umenu'),false);toggle($('#dbtn'),dm,false)}
$('#ubtn').onclick=e=>{e.stopPropagation();const o=$('#umenu').hidden;closeAll();toggle($('#ubtn'),$('#umenu'),o)};
$('#dbtn').onclick=e=>{e.stopPropagation();const o=dm.hidden;closeAll();toggle($('#dbtn'),dm,o)};
dm.onclick=e=>{const b=e.target.closest('button');if(!b)return;dm.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#dval').textContent=b.textContent};
document.addEventListener('click',closeAll);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

/* chips */
$('#chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="false">${c.replace(/&/g,'&amp;')}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  const on=b.getAttribute('aria-pressed')!=='true';
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed',on);cat=on?b.textContent:null;render()};

/* brands + products */
function render(){
  const q=$('#q').value.trim().toLowerCase();
  const bl=brands.filter(b=>(!cat||b.cats.includes(cat))&&(!q||b.n.toLowerCase().includes(q)));
  $('#bsec').hidden=!bl.length;
  $('#brands').innerHTML=bl.map(b=>`<button class="brand${b.full?' full':''}" aria-label="${b.n}${b.cart?', '+b.cart+' in cart':''}"><img src="${b.img}" alt="${b.n}">${b.cart?`<span class="bcart">${CART}${b.cart}</span>`:''}</button>`).join('');
  const pl=products.map((p,i)=>({p,i})).filter(({p})=>(!cat||p.cats.includes(cat))&&(!q||(p.b+' '+p.n+' 545469').toLowerCase().includes(q)));
  $('#grid').innerHTML=pl.map(({p,i})=>`<article class="card" data-i="${i}">
    <div class="ph"${p.bg?` style="background:${p.bg}"`:''}>${p.best?'<span class="tag">Best seller</span>':''}<button class="heart${p.fav?' on':''}" aria-label="Favourite"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-8-5.500-8-11a4.500 4.500 0 018-2.800A4.500 4.500 0 0120 10c0 5.500-8 11-8 11z"/></svg></button><img src="images/outdoor/m${p.img.slice(1)}.jpg" alt="${p.b}"></div>
    <div class="pb">${p.b}</div><div class="pn">${p.n}</div><div class="ps">545469</div>
    <div class="sw">${SW[p.img].map((s,k)=>`<button style="background:${s[0]}" aria-label="${s[1]}" aria-pressed="${k===(p.sw||0)&&p.sw!=null}"></button>`).join('')}</div>
    <div class="price">CAD $${PR[p.img][0]}.00<s>$${PR[p.img][1]}.00</s></div></article>`).join('');
  $('#empty').hidden=pl.length>0;
}
$('#q').oninput=render;
$('#grid').onclick=e=>{
  const card=e.target.closest('.card');if(!card)return;const p=products[+card.dataset.i];
  if(e.target.closest('.heart')){p.fav=!p.fav;e.target.closest('.heart').classList.toggle('on',p.fav);return}
  const s=e.target.closest('.sw button');
  if(s){const k=[...s.parentNode.children].indexOf(s);p.sw=p.sw===k?null:k;[...s.parentNode.children].forEach((x,j)=>x.setAttribute('aria-pressed',j===p.sw))}
};
$('#brands').onclick=e=>{const b=e.target.closest('.brand');if(!b)return;$('#q').value=b.getAttribute('aria-label').split(',')[0];render()};
render();
</script>
