<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Results — Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="marketplace.css?v=suggest2" />
    <link rel="stylesheet" href="marketplace-category.css?v=fmore" />
  </head>

  <body class="mp">
    <!-- ============================ Left rail ============================ -->
    <nav class="mp-nav" aria-label="Main">
      <span class="mp-nav__active" aria-hidden="true"></span>
      <a class="mp-nav__i" aria-label="Home" style="left:20px;top:21px;width:20px;height:18px"><img src="images/confirmation/nav-home.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Orders" aria-current="page" style="left:20px;top:79px;width:24px;height:24px"><img src="images/confirmation/nav-basket.svg" alt="" /></a>
      <a class="mp-nav__i mp-nav__i--inset" aria-label="Marketplace" style="left:19px;top:131px;width:24px;height:24px"><img src="images/confirmation/nav-marketplace.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Stores" style="left:20px;top:183px;width:24px;height:24px"><img src="images/confirmation/nav-storefront.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Promotions" style="left:20px;top:235px;width:20px;height:20px"><img src="images/confirmation/nav-tag.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Linesheets" style="left:20px;top:283px;width:24px;height:24px"><img src="images/confirmation/nav-linesheets.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Lists" style="left:19px;top:335px;width:20px;height:24px"><img src="images/confirmation/nav-list.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Whiteboard" style="left:18px;top:387px;width:24px;height:24px"><img src="images/confirmation/nav-whiteboard.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Order history" style="left:18px;top:439px;width:22px;height:18px"><img src="images/confirmation/nav-orders.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Customers" style="left:18px;top:485px;width:24px;height:17px"><img src="images/confirmation/nav-people.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Tasks" style="left:18px;top:530px;width:20px;height:24px"><img src="images/confirmation/nav-checklist.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Payments" style="left:18px;top:582px;width:24px;height:24px"><img src="images/confirmation/nav-payments.svg" alt="" /></a>
      <a class="mp-nav__i" aria-label="Settings" style="left:18px;top:634px;width:24px;height:24px"><img src="images/confirmation/nav-settings.svg" alt="" /></a>
      <div class="mp-nav__avatar" aria-hidden="true">
        <img class="mp-nav__oval" src="images/confirmation/nav-oval.svg" alt="" />
        <img class="mp-nav__mark" src="images/confirmation/nav-avatar-logo.svg" alt="" />
        <span>AY</span>
      </div>
    </nav>

    <div class="mp-page">
      <!-- ============================ Header ============================ -->
      <header class="mp-header">
        <a class="mp-brand" href="#">
          <img class="mp-brand__logo" src="images/confirmation/nuorder-logo.png" alt="" />
          <span>NuORDER</span>
        </a>
        <div class="mp-center">
        <button class="mp-dept" type="button">
          Fashion &amp; apparel
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <form class="mp-search" role="search" id="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <label class="sr-only" for="q">Search</label>
          <input id="q" type="search" placeholder="Search product, categories and brands" autocomplete="off" />
        </form>
        </div>
        <div class="mp-actions">
          <button class="mp-icon-btn" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1112 0v6l1.5 2h-15zM10 21h4"/></svg></button>
          <button class="mp-icon-btn" type="button" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
          <button class="mp-icon-btn" type="button" aria-label="Favourites"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.4 4.3 4.3 0 0119.5 10c0 5.4-7.5 10-7.5 10z"/></svg></button>
          <button class="mp-icon-btn" type="button" aria-label="Cart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 3.5h2.4l2.1 11h11.3l1.6-8.3H6.2"/><circle cx="8.4" cy="19" r="1.4"/><circle cx="17.8" cy="19" r="1.4"/></svg>
            <span class="mp-badge" id="cart-count" hidden>0</span>
          </button>
        </div>
      </header>

      <nav class="mp-subnav" aria-label="Categories">
        <a href="marketplace.html">Women's</a>
        <a>Men's</a>
        <a>Kids</a>
        <a>Accessories</a>
        <a>Footwear</a>
        <a>Brands</a>
      </nav>

      <main class="mp-list">
        <nav class="mp-crumbs" id="crumbs" aria-label="Breadcrumb" hidden></nav>
        <div class="mp-list__head">
          <p class="mp-list__kicker" id="kicker" hidden></p>
          <h1 class="mp-list__title" id="title"></h1>
          <span class="mp-list__count" id="count" aria-live="polite"></span>
        </div>
        <div class="mp-toolbar">
          <button class="mp-filterbtn" type="button" id="open-filters">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7"/><circle cx="11" cy="4" r="2"/><circle cx="5" cy="12" r="2"/></svg>
            <span id="filters-label">All filters</span>
          </button>
          <button class="mp-filterbtn mp-toggle" type="button" id="t-new" aria-pressed="false"><span>New products</span></button>
          <button class="mp-filterbtn mp-toggle" type="button" id="t-best" aria-pressed="false"><span>Top sellers</span></button>
          <div class="mp-applied" id="applied"></div>
          <label class="mp-sort"><span>Sort by:</span>
            <select id="sort">
              <option value="rel">Most relevant</option>
              <option value="new">Newest</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="az">Name: A–Z</option>
            </select>
          </label>
        </div>
        <div class="mp-results" id="results"></div>
        <div class="mp-more" id="more"></div>
      </main>
    </div>

    <aside class="mp-note" id="cart-note" role="status" aria-live="polite" aria-hidden="true">
      <div class="mp-note__head">
        <h2 class="mp-note__title">Added to cart</h2>
        <button class="mp-note__close" type="button" id="note-close" aria-label="Close" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="mp-note__body">
        <img class="mp-note__img" id="note-img" src="" alt="" />
        <div class="mp-note__info">
          <div class="mp-note__row"><span class="mp-note__name" id="note-name"></span><span class="mp-note__price" id="note-price"></span></div>
          <div class="mp-note__meta"><span>Color:</span> <span class="mp-note__color" id="note-color"></span></div>
        </div>
      </div>
    </aside>

    <div class="mp-drawer" id="drawer" aria-hidden="true">
      <div class="mp-drawer__scrim" data-close></div>
      <aside class="mp-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="mp-drawer__head"><h2 id="drawer-title">All filters</h2>
          <button type="button" data-close aria-label="Close filters"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
        <div class="mp-drawer__body" id="drawer-body"></div>
        <div class="mp-drawer__foot"><button type="button" id="f-clear">Clear all</button><button type="button" class="is-primary" id="f-apply">Show results</button></div>
      </aside>
    </div>

    <div class="mp-modal" id="pdp" role="dialog" aria-modal="true" aria-labelledby="pdp-title" hidden>
      <div class="mp-modal__scrim" data-close></div>
      <div class="mp-modal__panel">
        <button class="mp-modal__close" type="button" id="pdp-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="mp-pdp">
          <div class="mp-pdp__media">
            <div class="mp-pdp__img">
              <img id="pdp-img" src="" alt="" />
              <button class="mp-pdp__nav mp-pdp__nav--prev" id="pdp-prev" type="button" aria-label="Previous image"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg></button>
              <button class="mp-pdp__nav mp-pdp__nav--next" id="pdp-next" type="button" aria-label="Next image"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5"/></svg></button>
              <button class="mp-pdp__fav" id="pdp-fav" type="button" aria-pressed="false" aria-label="Add to favourites"><svg viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0112 7.400 4.300 4.300 0 0119.500 10c0 5.400-7.500 10-7.500 10z"/></svg></button>
            </div>
            <div class="mp-pdp__dots" id="pdp-dots"></div>
          </div>
          <div class="mp-pdp__info">
            <div class="mp-pdp__meta mp-pdp__brandline" id="pdp-brand"></div>
            <h2 class="mp-pdp__title" id="pdp-title"></h2>
            <p class="mp-pdp__meta" id="pdp-meta"></p>
            <p class="mp-pdp__desc is-clamped" id="pdp-descwrap"><span id="pdp-desc"></span></p>
            <div class="mp-pdp__price">
              <span class="mp-pdp__now" id="pdp-price"></span>
              <span class="mp-pdp__msrp" id="pdp-msrp"></span>
            </div>
            <div class="mp-pdp__label"><b>Color:</b> <span id="pdp-color"></span></div>
            <div class="mp-pdp__swatches" id="pdp-swatches"></div>
            <div class="mp-pdp__label mp-pdp__label--b" id="pdp-qtylabel"></div>
            <div class="mp-pdp__qty" id="pdp-qty"></div>
            <div class="mp-pdp__total">
              <span><b>Selected item:</b> <span id="pdp-units">0 units</span></span>
              <span id="pdp-total">USD <b>$0.00</b></span>
            </div>
            <button class="mp-pdp__add" id="pdp-add" type="button">Add to cart</button>
            <p class="mp-pdp__hint" id="pdp-hint" role="alert" hidden>Enter a quantity to add this item to your cart.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="mp-toast" id="toast" role="status" aria-live="polite"></div>

    <script src="marketplace-products.js?v=gapwomen"></script>
    <script src="marketplace-categories.js?v=swatchfix2"></script>
    <script src="marketplace-brands.js?v=3"></script>
    <script src="marketplace-search.js?v=9"></script>
    <script src="marketplace-mega.js?v=7"></script>
    <script src="marketplace-select.js?v=1"></script>
    <script>
      /* ---------- Products (data from marketplace-products.js) ---------- */
      const { market, arrivals, liked } = window.MP_PRODUCTS; // "You might like" has its own 15 styles, none repeated above
      const lists = { results: [] };
      const MAX_SWATCHES = 5;

      // Remixed brand names so the grid doesn't read as one retailer (assigned per style, so repeats stay consistent).
      const brandNames = ['Marlow & Finch', 'Northfield', 'Wren & Willow', 'Juniper Row', 'Harbour Lane', 'Atelier Verne', 'Sable Studio', 'Ashby & Hide', 'Everlane'];
      const brandOf = {};
      MP_CAT.everything.forEach((p, i) => { brandOf[p.name] = brandNames[i % brandNames.length]; });
      // Card titles drop the fabric suffix ("… in Luxe Merino") so they stay on one line; the full name is the tooltip.
      const shortOverrides = { 'Fine Cashmere Long-Sleeve U-Neck Sweater': 'Fine Cashmere U-Neck Sweater', 'Bouclé Oversized Deep V-Neck Sweater': 'Bouclé Deep V-Neck Sweater' };
      const shortName = (n) => shortOverrides[n] || n.split(' in ')[0];
      const wholesale = (msrp) => msrp / 2; // keystone: wholesale is half of MSRP

      function card(p, idx, tag) {
        tag = tag || (window.MP_CAT && (MP_CAT.isNew(p) ? 'New' : MP_CAT.isTop(p) ? 'Top seller' : ''));   // New arrivals pass 'New' for all; elsewhere a stable random ~20%
        const shown = p.colors.slice(0, MAX_SWATCHES), extra = p.colors.length - shown.length;
        const sw = shown.map((c, i) =>
          `<button class="mp-swatch ${i === 0 ? 'is-active' : ''}" type="button" data-i="${i}" style="--c:${c.hex}" aria-label="${c.name}" title="${c.name}"></button>`).join('');
        return `<article class="mp-card" data-idx="${idx}">
          <div class="mp-card__media">
            ${tag ? '<span class=\"mp-card__tag\">' + tag + '</span>' : ''}
            <img src="${p.colors[0].img}" alt="${p.name} in ${p.colors[0].name}" decoding="async" />
            <button class="mp-card__fav" type="button" aria-pressed="false" aria-label="Add to favourites"><svg viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0112 7.400 4.300 4.300 0 0119.500 10c0 5.400-7.500 10-7.500 10z"/></svg></button>
            <button class="mp-card__cart" type="button" aria-pressed="false" aria-label="Add to cart">
              <svg class="mp-cart-empty" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 3.5h2.4l2.1 11h11.3l1.6-8.3H6.2"/><circle cx="8.4" cy="19" r="1.4"/><circle cx="17.8" cy="19" r="1.4"/></svg>
              <svg class="mp-cart-full" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.500 3H5.300l.5 2.500H21.500l-2 10.500H8L5 4.500" fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round" stroke-linecap="round"/><path d="M10.500 10.500l2.300 2.300 4-4.200" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19.500" r="1.600" fill="currentColor"/><circle cx="17" cy="19.500" r="1.600" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="mp-card__body">
            <span class="mp-card__brand">${brandOf[p.name].replace("&", "&amp;")}</span>
            <h3 class="mp-card__name"><a href="#" title="${p.name}">${shortName(p.name)}</a></h3>
            <div class="mp-swatches">${sw}${extra > 0 ? `<span class="mp-swatches__more">+${extra}</span>` : ''}</div>
            <span class="mp-card__price">USD $${wholesale(p.price).toFixed(2)}</span>
            <span class="mp-card__msrp">MSRP $${p.price.toFixed(2)}</span>
          </div>
        </article>`;
      }

      // Swatch: swap the photo to that colourway. Fav: toggle.
      document.addEventListener('click', (e) => {
        const sw = e.target.closest('.mp-swatch');
        if (sw) {
          const el = sw.closest('.mp-card');
          const c = lists[el.parentElement.id][el.dataset.idx].colors[sw.dataset.i];
          el.querySelectorAll('.mp-swatch').forEach(s => s.classList.remove('is-active'));
          sw.classList.add('is-active');
          const img = el.querySelector('.mp-card__media img');
          img.src = c.img; img.alt = el.querySelector('.mp-card__name').textContent + ' in ' + c.name;
          return;
        }
        const cartBtn = e.target.closest('.mp-card__cart');
        if (cartBtn) {
          const on = cartBtn.classList.toggle('is-in');
          cartBtn.setAttribute('aria-pressed', on);
          cartBtn.setAttribute('aria-label', on ? 'Remove from cart' : 'Add to cart');
          const badge = document.getElementById('cart-count');
          const count = Math.max(0, (+badge.textContent || 0) + (on ? 1 : -1));
          badge.textContent = count;
          if (count === 0) {
            badge.hidden = true;                      // empty cart: no badge
          } else {
            const firstItem = badge.hidden;           // first item pops the badge in; later ones bump it
            badge.hidden = false;
            badge.classList.remove('is-pop', 'is-bump'); void badge.offsetWidth;
            badge.classList.add(firstItem ? 'is-pop' : 'is-bump');
          }
          if (on) {
            const cardEl = cartBtn.closest('.mp-card');
            const p = lists[cardEl.parentElement.id][cardEl.dataset.idx];
            const sw = cardEl.querySelector('.mp-swatch.is-active');
            if (!suppressNote) showCartNote(p, p.colors[sw ? +sw.dataset.i : 0]);
          } else {
            toast('Removed from cart');
          }
          return;
        }
        const fav = e.target.closest('.mp-card__fav');
        if (fav) {
          const on = fav.classList.toggle('is-on');
          fav.setAttribute('aria-pressed', on);
          fav.setAttribute('aria-label', on ? 'Remove from favourites' : 'Add to favourites');
          toast(on ? 'Added to favourites' : 'Removed from favourites');
        }
      });
      const brandTiles = [
        ['Wren & Willow',   'Women\'s Fashion',     2000, 4.5, 21],
        ['Marlow & Finch',   'Women\'s Fashion',     1500, 4.7, 38],
        ['Northfield',       'Women\'s Fashion',     2500, 4.4, 12],
        ['Juniper Row',      'Women\'s Footwear',    1800, 4.6, 54],
        ['Harbour Lane',      'Women\'s Denim',       1200, 4.3, 17],
        ['Atelier Verne',    'Women\'s Accessories', 3000, 4.8, 29],
        ['Sable Studio',     'Women\'s Fashion',     1000, 4.5, 63],
        ['Ashby & Hide',     'Leather goods',    2200, 4.2, 9]
      ];
      /* ---------- Added-to-cart note: slides in from the right, holds, slides back out ---------- */
      const note = document.getElementById('cart-note');
      let noteTimer, suppressNote = false;   // suppressNote: the product dialog confirms on its own button, so no slide-in
      const NOTE_HOLD = 3500;
      function hideCartNote() {
        clearTimeout(noteTimer);
        note.classList.remove('is-open');
        note.setAttribute('aria-hidden', 'true');
        document.getElementById('note-close').tabIndex = -1;
      }
      function armNoteTimer() { clearTimeout(noteTimer); noteTimer = setTimeout(hideCartNote, NOTE_HOLD); }
      function showCartNote(p, color) {
        document.getElementById('note-img').src = color.img;
        document.getElementById('note-img').alt = p.name + ' in ' + color.name;
        document.getElementById('note-name').textContent = shortName(p.name);
        document.getElementById('note-price').textContent = '$' + wholesale(p.price).toFixed(2);
        document.getElementById('note-color').textContent = color.name;
        note.classList.add('is-open');
        note.setAttribute('aria-hidden', 'false');
        document.getElementById('note-close').tabIndex = 0;
        armNoteTimer();
      }
      document.getElementById('note-close').addEventListener('click', hideCartNote);
      // Stay put while the pointer is over it or focus is inside it
      note.addEventListener('mouseenter', () => clearTimeout(noteTimer));
      note.addEventListener('mouseleave', () => { if (note.classList.contains('is-open')) armNoteTimer(); });
      note.addEventListener('focusin', () => clearTimeout(noteTimer));
      note.addEventListener('focusout', () => { if (note.classList.contains('is-open')) armNoteTimer(); });

      /* ---------- Product detail modal (opens from any product card) ---------- */
      const pdp = document.getElementById('pdp');
      const $ = (id) => document.getElementById(id);
      let pdpState = null;
      const money = (n) => '$' + n.toFixed(2);
      const brandInfo = (name) => {
        const t = brandTiles.find((b) => b[0] === name);
        return t ? { min: t[2], rating: t[3], n: t[4] } : { min: 1500, rating: 4.6, n: 40 };
      };
      const sizesFor = (p) => p.sizes
        ? { label: p.sizeLabel || 'Size quantities', sizes: p.sizes }
        : p.type === 'Jewelry'
        ? { label: 'Quantities', sizes: ['One size'] }
        : p.type === 'Bottoms'
        ? { label: 'Waist quantities', sizes: [28, 29, 30, 31, 32, 33, 34, 36, 38] }
        : { label: 'Size quantities', sizes: ['XXS', 'XS', 'S', 'M', 'L', 'XL'] };

      // Gallery: every photo of the selected colourway, reached with the arrows, dots or ← → keys (no looping)
      function pdpShowImage(g) {
        const { p, ci } = pdpState; const c = p.colors[ci];
        const list = c.images && c.images.length ? c.images : [c.img];
        const gi = Math.max(0, Math.min(list.length - 1, g));
        pdpState.gi = gi;
        $('pdp-img').src = list[gi];
        $('pdp-img').alt = p.name + ' in ' + c.name + ' (photo ' + (gi + 1) + ' of ' + list.length + ')';
        $('pdp-dots').querySelectorAll('.mp-pdp__dot').forEach((d, k) => { d.classList.toggle('is-active', k === gi); d.setAttribute('aria-current', k === gi); });
        $('pdp-prev').disabled = gi <= 0; $('pdp-next').disabled = gi >= list.length - 1;
        $('pdp-prev').hidden = $('pdp-next').hidden = list.length < 2;
        if (list[gi + 1]) { const pre = new Image(); pre.src = list[gi + 1]; }
      }
      // Quantities are kept per colour: switching shows the new colour's numbers (empty if none yet) and switching back restores them
      function pdpSaveQty() {
        const q = {};
        $('pdp-qty').querySelectorAll('input').forEach((el, k) => { if (el.value) q[k] = el.value; });
        pdpState.qty[pdpState.ci] = q;
      }
      function pdpLoadQty() {
        const q = pdpState.qty[pdpState.ci] || {};
        $('pdp-qty').querySelectorAll('input').forEach((el, k) => { el.value = q[k] || ''; syncStepper(el); });
      }
      function pdpSelectColor(i) {
        const { p } = pdpState; const c = p.colors[i];
        pdpSaveQty();
        pdpState.ci = i;
        pdpLoadQty();
        pdpTotals();
        $('pdp-color').textContent = c.name;
        $('pdp-swatches').querySelectorAll('.mp-pdp__sw').forEach((b, k) => { b.classList.toggle('is-active', k === i); b.setAttribute('aria-pressed', k === i); });
        const list = c.images && c.images.length ? c.images : [c.img];
        $('pdp-dots').innerHTML = list.length > 1 ? list.map((_, k) => '<button class="mp-pdp__dot" type="button" data-i="' + k + '" aria-label="Show photo ' + (k + 1) + ' of ' + list.length + '"></button>').join('') : '';
        pdpShowImage(0);
      }
      // One-line product name: start at 24px and step down until it fits (never wraps)
      function pdpFitTitle() {
        const t = $('pdp-title'); let size = 24; t.style.fontSize = size + 'px';
        while (t.scrollWidth > t.clientWidth && size > 18) { size -= 1; t.style.fontSize = size + 'px'; }
      }

        $('f-apply').textContent = `Show results (${list.length})`;   // live count of what the current filters return
        updateFiltersLabel();
        $('t-new').setAttribute('aria-pressed', F.newOnly); $('t-best').setAttribute('aria-pressed', F.bestOnly);
        const chips = [];
        ['brand', 'type', 'color', 'ships'].forEach((k) => F[k].forEach((v) => chips.push([k, v, v])));
        if (F.min !== '' || F.max !== '') chips.push(['price', '', `$${F.min || 0} – ${F.max ? '$' + F.max : 'any'}`]);
        $('applied').innerHTML = chips.map(([k, v, label]) => `<span class="mp-applied__chip">${esc(label)}<button type="button" data-k="${k}" data-v="${esc(v)}" aria-label="Remove ${esc(label)}"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8"/></svg></button></span>`).join('')
          + (chips.length > 1 ? '<button class="mp-applied__clear" type="button" id="clear-all">Clear all</button>' : '');
        lists.results = [];
        $('results').innerHTML = list.length ? (lists.results = list.slice(0, shown)).map((p, i) => card(p, i, !q && category.toLowerCase() === 'new arrivals' ? 'New' : '')).join('')
          : `<div class="mp-empty"><h2>No products match these filters</h2><p>Try removing a filter to see more.</p><button type="button" id="empty-clear">Clear filters</button></div>`;
        const more = list.length > shown;
        $('more').innerHTML = list.length > PAGE ? `<progress max="${list.length}" value="${Math.min(shown, list.length)}"></progress><span>Showing ${Math.min(shown, list.length)} of ${list.length}</span>${more ? '<button type="button" id="load-more">Load more</button>' : ''}` : '';
      }
      $('sort').addEventListener('change', () => { shown = PAGE; render(); });
      $('applied').addEventListener('click', (e) => {
        if (e.target.closest('#clear-all')) return clearFilters();
        const b = e.target.closest('button[data-k]'); if (!b) return;
        if (b.dataset.k === 'price') F.min = F.max = ''; else F[b.dataset.k].delete(b.dataset.v);
        shown = PAGE; render();
      });
      document.addEventListener('click', (e) => {
        if (e.target.closest('#empty-clear')) return clearFilters();
        if (e.target.closest('#load-more')) { shown += PAGE; render(); }
      });

      render();
      if (openName && base[0] && base[0].name.split(' in ')[0] === openName) { const first = $('results').querySelector('.mp-card'); if (first) openPdp(first); }

    </script>
  </body>
</html>
